<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-Марио Раннер с Чит-кодом</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Courier New', Courier, monospace;
        }
        /* Игровое поле */
        #game-container {
            width: 600px;
            height: 300px;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: background-color 1.5s ease;
        }
        /* Земля */
        #ground {
            width: 100%;
            height: 40px;
            border-top: 4px solid #000;
            position: absolute;
            bottom: 0;
            transition: background-color 1.5s ease;
        }
        /* Марио */
        #mario {
            width: 40px;
            height: 40px;
            background-color: #ff0000; 
            position: absolute;
            bottom: 40px;
            left: 50px;
            border-radius: 10px 10px 0 0;
            border: 2px solid #000;
            border-bottom: 12px solid #0000ff; 
            z-index: 2;
        }
        /* ЧИТ-КОД: Класс для полета */
        .flying {
            bottom: 180px !important; /* Высота полета (выше труб) */
            box-shadow: 0 0 25px #ffea00; /* Золотое свечение */
            border-color: #ffea00 !important;
            border-bottom-color: #ffea00 !important;
        }
        /* Препятствие */
        #obstacle {
            width: 30px;
            height: 40px;
            background-color: #00b100;
            position: absolute;
            bottom: 40px;
            left: 600px; 
            border: 2px solid #000;
            border-top: 10px solid #006000;
            z-index: 1;
        }
        /* Счета */
        #score-board {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 3;
        }
        #level-board {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            z-index: 3;
        }
        /* Индикатор чит-кода */
        #cheat-indicator {
            position: absolute;
            top: 50px;
            left: 15px;
            color: #ffea00;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            z-index: 3;
            display: none; /* Скрыт по умолчанию */
        }
        /* Анимация прыжка */
        .jump-anim {
            animation: jump 0.5s linear;
        }
        @keyframes jump {
            0% { bottom: 40px; }
            40% { bottom: 160px; }
            50% { bottom: 170px; }
            60% { bottom: 160px; }
            100% { bottom: 40px; }
        }
        .move-anim {
            animation: move 1.5s infinite linear;
        }
        @keyframes move {
            0% { left: 600px; }
            100% { left: -40px; }
        }
        #controls {
            margin-top: 20px;
            color: white;
            text-align: center;
            line-height: 1.5;
        }
        .secret {
            color: #ffea00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">Счет: <span id="score">0</span></div>
        <div id="cheat-indicator">ЧИТ КОД АКТИВЕН</div>
        <div id="level-board">Уровень: <span id="level">1</span></div>
        <div id="mario"></div>
        <div id="obstacle" class="move-anim"></div>
        <div id="ground"></div>
    </div>
    
    <div id="controls">
        <h2>Управление:</h2>
        <p><strong>Пробел</strong>, <strong>Стрелка Вверх</strong> или <strong>Клик</strong> — Прыжок</p>
        <p class="secret">Нажми ENTER для активации режима полета!</p>
    </div>

    <script>
        const mario = document.getElementById("mario");
        const obstacle = document.getElementById("obstacle");
        const scoreElement = document.getElementById("score");
        const levelElement = document.getElementById("level");
        const gameContainer = document.getElementById("game-container");
        const ground = document.getElementById("ground");
        const cheatIndicator = document.getElementById("cheat-indicator");

        let isJumping = false;
        let isFlying = false; // Переменная для чит-кода
        let score = 0;
        let currentLevel = 0;
        let isGameOver = false;

        const locations =[
            { bg: "#5C94FC", ground: "#c84c0c" },
            { bg: "#000000", ground: "#5c2400" }, 
            { bg: "#a8c0f0", ground: "#ffffff" }, 
            { bg: "#300000", ground: "#606060" }, 
            { bg: "#080828", ground: "#005800" }  
        ];

        function setLocation(levelIndex) {
            const theme = locations[levelIndex % locations.length];
            gameContainer.style.backgroundColor = theme.bg;
            ground.style.backgroundColor = theme.ground;
            levelElement.innerText = levelIndex + 1;
        }

        setLocation(0);

        function jump() {
            // Прыгаем только если не в воздухе, не проиграли и НЕ летим (чит-код)
            if (!isJumping && !isGameOver && !isFlying) {
                isJumping = true;
                mario.classList.add("jump-anim");

                setTimeout(() => {
                    mario.classList.remove("jump-anim");
                    isJumping = false;
                }, 500); 
            }
        }

        document.addEventListener("keydown", function(event) {
            if (event.code === "Space" || event.code === "ArrowUp") {
                jump();
            }
            
            // ЛОГИКА ЧИТ-КОДА
            if (event.code === "Enter") {
                isFlying = !isFlying; // Меняем состояние полета
                
                if (isFlying) {
                    // Включаем полет
                    mario.classList.remove("jump-anim"); // Прерываем обычный прыжок, если он был
                    isJumping = false;
                    
                    mario.style.transition = "bottom 0.5s ease"; // Добавляем плавность взлета
                    mario.classList.add("flying");
                    cheatIndicator.style.display = "block"; // Показываем надпись
                } else {
                    // Выключаем полет
                    mario.classList.remove("flying");
                    cheatIndicator.style.display = "none"; // Прячем надпись
                    
                    // Убираем плавность (transition) после того как он приземлится,
                    // чтобы не сломать скорость обычного прыжка (через 500мс)
                    setTimeout(() => {
                        if (!isFlying) mario.style.transition = "none";
                    }, 500);
                }
            }
        });
        
        document.addEventListener("mousedown", jump);
        document.addEventListener("touchstart", jump);

        let gameLoop = setInterval(function() {
            let marioBottom = parseInt(window.getComputedStyle(mario).getPropertyValue("bottom"));
            let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue("left"));

            // Проверка столкновения
            // Если Марио выше 80px (а в полете он на высоте 180px), он пролетает над трубой!
            if (obstacleLeft < 90 && obstacleLeft > 20 && marioBottom < 80) {
                
                obstacle.style.animation = "none";
                obstacle.style.left = obstacleLeft + "px"; 
                isGameOver = true;
                
                let finalScore = Math.floor(score / 10);
                alert("Игра окончена! Ваш счет: " + finalScore + ".\nНажмите ОК, чтобы начать заново.");
                
                // Сброс чит-кода при проигрыше (на всякий случай)
                isFlying = false;
                mario.classList.remove("flying");
                mario.style.transition = "none";
                cheatIndicator.style.display = "none";

                // Перезапуск
                obstacle.style.animation = "move 1.5s infinite linear";
                score = 0;
                currentLevel = 0;
                setLocation(0);
                isGameOver = false;

            } else {
                score++;
                let displayScore = Math.floor(score / 10);
                scoreElement.innerText = displayScore;

                let newLevel = Math.floor(displayScore / 100);
                if (newLevel > currentLevel) {
                    currentLevel = newLevel;
                    setLocation(currentLevel); 
                }
            }
        }, 10);
    </script>

</body>
</html>
